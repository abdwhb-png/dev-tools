name: Development tools qualification
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**/*.md']
concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          else
            python3 scripts/qualification.py --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --allow-missing
          fi
  build:
    needs: evidence
    if: needs.evidence.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/build_installer.py --revision "$GITHUB_SHA" --version "$VERSION" --output .ci-installer
        env:
          VERSION: v0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: installer-candidate
          path: .ci-installer
          include-hidden-files: true
  isolated:
    needs: [evidence, build]
    if: always() && needs.evidence.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify CI token can read qualification artifacts
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name installer-candidate --dir "$RUNNER_TEMP/evidence-token-check"
          sh -n "$RUNNER_TEMP/evidence-token-check/.ci-installer"
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n bootstrap.sh scripts/install.sh.in
      - run: bash -n scripts/qualify.sh
  ubuntu_native:
    name: ubuntu (24.04, AppArmor)
    needs: [build, isolated]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: installer-candidate
      - name: Prepare native Ubuntu with restricted AppArmor
        run: |
          set -euo pipefail
          test ! -e /.dockerenv
          sudo systemctl start apparmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo aa-status
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl python3 sudo zsh
          sudo useradd -m -s /bin/bash qualifier
          echo 'qualifier ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/qualifier >/dev/null
          sudo chmod 440 /etc/sudoers.d/qualifier
          sudo cp -a . /home/qualifier/source
          sudo chown -R qualifier:qualifier /home/qualifier/source
          sudo apt-get remove -y git git-man
      - name: Qualify migration and actual browser sandbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo -H -u qualifier --preserve-env=GH_TOKEN,GITHUB_REPOSITORY env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_CACHE_HOME -u XDG_STATE_HOME -u XDG_RUNTIME_DIR GITHUB_ACTIONS=true CI=true bash -c 'cd /home/qualifier/source && bash scripts/qualify.sh ubuntu-native'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-24.04-evidence
          path: /home/qualifier/source/evidence/
  ubuntu:
    needs: [build, ubuntu_native]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['26.04']
    container: ubuntu:${{ matrix.release }}
    steps:
      - name: Prepare disposable operator
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git python3 sudo zsh
          useradd -m -s /bin/bash qualifier
          echo 'qualifier ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/qualifier
          chmod 440 /etc/sudoers.d/qualifier
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: installer-candidate
      - name: Copy source to writable isolated home
        run: |
          cp -a . /home/qualifier/source
          chown -R qualifier:qualifier /home/qualifier/source
      - name: Qualify actual installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get remove -y git
          sudo -H -u qualifier --preserve-env=GH_TOKEN,GITHUB_REPOSITORY env GITHUB_ACTIONS=true CI=true bash -c 'cd /home/qualifier/source && bash scripts/qualify.sh ubuntu'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-${{ matrix.release }}-evidence
          path: /home/qualifier/source/evidence/
  wsl2:
    needs: [build, ubuntu_native]
    timeout-minutes: 30
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: installer-candidate
      - name: Prepare real WSL2 distribution
        shell: pwsh
        run: |
          wsl --set-default-version 2
          wsl --install --distribution Ubuntu-${{ matrix.release }} --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'WSL installation failed' }
          wsl -d Ubuntu-${{ matrix.release }} -u root --exec bash -lc 'set -euo pipefail; uname -r | grep -i microsoft-standard-WSL2; apt-get update; apt-get install -y ca-certificates curl git python3 sudo zsh; useradd -m -s /bin/bash qualifier; echo "qualifier ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/qualifier; chmod 440 /etc/sudoers.d/qualifier'
          if ($LASTEXITCODE -ne 0) { throw 'WSL operator preparation failed' }
      - name: Qualify actual WSL installation
        env:
          GH_TOKEN: ${{ github.token }}
          WSLENV: GH_TOKEN:GITHUB_REPOSITORY
        shell: pwsh
        run: |
          $source = (wsl -d Ubuntu-${{ matrix.release }} --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          wsl -d Ubuntu-${{ matrix.release }} -u root --exec bash -lc "set -e; cp -a '$source' /home/qualifier/source; chown -R qualifier:qualifier /home/qualifier/source; apt-get remove -y git"
          if ($LASTEXITCODE -ne 0) { throw 'WSL source copy failed' }
          wsl -d Ubuntu-${{ matrix.release }} -u qualifier --exec bash -lc 'cd /home/qualifier/source && env GITHUB_ACTIONS=true CI=true bash scripts/qualify.sh wsl2'
          if ($LASTEXITCODE -ne 0) { throw 'WSL qualification failed' }
      - name: Diagnose Socket release access after a WSL failure
        if: failure()
        shell: pwsh
        run: |
          $probe = @'
          cd /home/qualifier/source
          "$HOME/.local/bin/mise" -C "$HOME/.local/share/dev-tools/source" exec -- node --input-type=module <<'NODE' > evidence/sfw-network.txt 2>&1
          import https from 'node:https';
          console.log('Node', process.version);
          const request = https.get('https://api.github.com/repos/SocketDev/sfw-free/releases/latest', {headers: {'User-Agent': 'sfw-free/2.0.6'}}, response => {
            console.log('HTTP', response.statusCode, 'rate remaining', response.headers['x-ratelimit-remaining'], 'reset', response.headers['x-ratelimit-reset']);
            let body = '';
            response.on('data', chunk => body += chunk);
            response.on('end', () => {
              try { const data = JSON.parse(body); console.log(data.message ?? data.tag_name); }
              catch { console.log('Non-JSON response'); }
            });
          });
          request.setTimeout(30000, () => request.destroy(new Error('Socket API diagnostic timed out')));
          request.on('error', error => { console.error(error); process.exitCode = 1; });
          NODE
          cat evidence/sfw-network.txt
          '@
          $probe | wsl -d Ubuntu-${{ matrix.release }} -u qualifier --exec bash
      - name: Collect evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/wsl-evidence" | Out-Null
          $destination = (wsl -d Ubuntu-${{ matrix.release }} --exec wslpath -a "$env:RUNNER_TEMP/wsl-evidence").Trim()
          wsl -d Ubuntu-${{ matrix.release }} -u root --exec bash -lc "if test -d /home/qualifier/source/evidence; then cp -a /home/qualifier/source/evidence/. '$destination/'; fi"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl2-${{ matrix.release }}-evidence
          path: ${{ runner.temp }}/wsl-evidence/
